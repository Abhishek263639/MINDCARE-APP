<div class="app-wrapper">
  
  @if (currentPage() !== 'login') {
    <header class="app-header-desktop">
      <nav class="container">
        <span class="logo">MindCare</span>
        <div class="nav-desktop">
          <button [class.active]="currentPage() === 'dashboard'" (click)="setPage('dashboard')">
            <span>Dashboard</span>
          </button>
          <button [class.active]="currentPage() === 'suggestions'" (click)="setPage('suggestions')">
            <span>Suggestions</span>
          </button>
          <button [class.active]="currentPage() === 'profile'" (click)="setPage('profile')">
            <span>Profile</span>
          </button>
        </div>
      </nav>
    </header>
  }

  <main class="main-content">
    @switch (currentPage()) {
      @case ('login') {
        <app-login (changePage)="setPage($event)"></app-login>
      }
      @case ('dashboard') {
        <app-dashboard></app-dashboard>
      }
      @case ('suggestions') {
        <app-suggestions></app-suggestions>
      }
      @case ('profile') {
        <app-profile 
          [darkMode]="darkMode" 
          (changePage)="setPage($event)"
          (toggleDarkMode)="toggleDarkMode()"
        ></app-profile>
      }
    }
  </main>
  
  @if (currentPage() !== 'login') {
    <nav class="app-nav-mobile">
      <button [class.active]="currentPage() === 'dashboard'" (click)="setPage('dashboard')">
        <span class="icon">🏠</span>
        <span class="text">Dashboard</span>
      </button>
      <button [class.active]="currentPage() === 'suggestions'" (click)="setPage('suggestions')">
        <span class="icon">✨</span>
        <span class="text">Suggest</span>
      </button>
      <button [class.active]="currentPage() === 'profile'" (click)="setPage('profile')">
        <span class="icon">👤</span>
        <span class="text">Profile</span>
      </button>
    </nav>
  }
  
</div>
